<!-- 링크를 공유했을 때 뜨는 미리보기 카드 (카카오톡·메신저·SNS) -->
<meta property="og:type" content="website">
<meta property="og:title" content="ULSAN HD FC 1 VS 1 축구">
<meta property="og:description" content="울산 HD FC 선수 12명 중 한 명을 골라 1대1로 붙는 60초 헤드 사커. 선수마다 필살기가 있다.">

<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<!-- 글꼴은 첫 화면과 게임 시작을 막지 않는다: Teko(숫자·VS)는 같은 서버에서, Pretendard(한글)는 CDN 에서 뒤늦게 받아 끼운다.
     전엔 두 CDN 스타일시트가 응답할 때까지 빈 화면이었다 (2026-11-12 CDN 을 막고 재현) -->
<link rel="preload" as="font" type="font/woff2" href="fonts/teko-600-latin.woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage" class="sheet-open">
  <!-- 캔버스는 무대(화면) 전체를 덮는다. 점수판 옆 버튼과 키 안내는 그 위 가운데 -->
  <canvas id="game" width="1280" height="720" aria-label="경기장"></canvas>
  <button class="sub" data-btn="sub" type="button" aria-label="선수 교체">교체</button>
  <button class="sub menu" type="button" aria-label="일시정지 메뉴" disabled>메뉴</button>
  <div class="keys one" aria-label="키보드: 방향키로 이동·점프, Space 로 슛"><span class="arrows"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><em>이동 · 점프</em><kbd class="wide">Space</kbd><em>슛</em></div>
  <div class="keys two" aria-label="2인: 1P 는 A D 이동, W 점프, Tab 슛. 2P 는 방향키 이동·점프, Space 슛"><b>1P</b><kbd>A</kbd><kbd>D</kbd><em>이동</em><kbd>W</kbd><em>점프</em><kbd class="wide">Tab</kbd><em>슛</em><i></i><b>2P</b><kbd>←</kbd><kbd>→</kbd><em>이동</em><kbd>↑</kbd><em>점프</em><kbd class="wide">Space</kbd><em>슛</em></div>

  <!-- 조작 버튼: 화면 아래 양 모서리 -->
  <div class="pad left" aria-label="이동">
    <button class="ctl" data-btn="left" type="button" aria-label="왼쪽으로"><span class="glyph">◀</span></button>
    <button class="ctl" data-btn="right" type="button" aria-label="오른쪽으로"><span class="glyph">▶</span></button>
  </div>
  <div class="pad right" aria-label="동작">
    <button class="ctl jump" data-btn="jump" type="button" aria-label="점프"><span>점프</span></button>
    <button class="ctl kick" data-btn="kick" type="button" aria-label="슛"><span>슛</span></button>
  </div>

  <!-- 사진이 내려오는 동안 보이는 첫 화면. JS 가 선택 화면으로 갈아끼운다 (2026-11-03 형준 "로딩 화면이 어색해서": 전엔 빈 경기장과 조작 버튼이 먼저 보였다) -->
  <div id="overlay"><div class="sheet loading"><div class="brand"><span class="emblem" aria-hidden="true"></span><div class="brand-text"><span class="club">ULSAN HD FC</span><h1><span class="vs">1 VS 1</span> 축구</h1></div></div><span class="loading-bar" role="progressbar" aria-label="불러오는 중"></span></div></div>
  <div id="hint" hidden>폰을 가로로 돌려 주세요</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
